components:
  schemas:
    yearlyRolloutCountingTime:
      required:
      - code
      - executionTimeFrom
      - executionTimeUntil
      - version
      - startCodeRegisterBeginYear
      - yearlyRolloutCountingTimeRegisters
      type: object
      description: "Jährlich ausgerollte Zählzeit eines NB/LF"
      x-Translation:
        de: "Jährlich ausgerollte Zählzeit eines NB/LF"
      properties:
        code:
          $ref: './../codeAn3.yaml#/components/schemas/codeAn3'
          description: "Code der Zählzeit"
        executionTimeFrom:
          $ref: './../dateAndTime/zeroTimeLegalGerman.yaml#/components/schemas/zeroTimeLegalGerman'
          description: "Zeitpunkt Gültig ab (01.01 00:00 Uhr eines Kalenderjahres)"
        executionTimeUntil:
          $ref: './../dateAndTime/zeroTimeLegalGerman.yaml#/components/schemas/zeroTimeLegalGerman'
          description: "Zeitpunkt Gültig bis (01.01 00:00 Uhr eines Kalenderjahres)"
        version:
          $ref: './../dateAndTime/dateTime.yaml#/components/schemas/dateTime'
          description: "Versionsangabe"
        orderReference:
          $ref: './../header/transactionId.yaml#/components/schemas/transactionId'
          description: "Referenz auf eine mögliche Reklamation"
        startCodeRegisterBeginYear:
          $ref: './../codeAn3.yaml#/components/schemas/codeAn3'
          description: "Das zum 01.01. 0:00 Uhr des jeweiligen Kalendarjahres aktive Register"
        yearlyRolloutCountingTimeRegisters:
          $ref: './yearlyRolloutCountingTimeRegisters.yaml#/components/schemas/yearlyRolloutCountingTimeRegisters'
          description: "Die ausgerollte Zählzeit mit den Registern und deren Änderungszeitpunkte über das Kalendarjahr"        
