components:
  schemas:
    maximumPower:
      required:
        - power
      type: object
      description: "Angabe einer maximalen Leistung entweder in % (powerPercent) oder in KW (powerKilowatt) - siehe oneOf"
      x-Translation:
        de: "Angabe einer maximalen Leistung in % oder in Kilowatt (kw)"
      properties:
        powerPercent:
         allOf:
           - $ref: './../percent.yaml#/components/schemas/percent'
             description: "Angabe in %"
        powerKilowatt:
         allOf:
           - $ref: './../kilowatt.yaml#/components/schemas/kilowatt'
             description: "Angabe in kw"
      oneOf:
        - required:
            - powerPercent
        - required:
            - powerKilowatt