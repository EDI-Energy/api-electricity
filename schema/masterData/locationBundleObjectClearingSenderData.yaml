components:
  schemas:
    locationBundleObjectClearingSenderData:
      required:
      - locationId
      type: object
      x-Translation:
        de: "Die Zeitscheiben der Liste aller im Lokationsbündel enthaltenen Netzlokationen, Marktlokationen, Messlokationen, technischen Ressourcen, Tranchen und steuerbaren Ressourcen aus Sicht des Senders zu den Systemdaten, erwarteten Daten, keinen erwarteten Daten und keinen Systemdaten"
      properties:
        locationId:
          oneOf:
            - $ref: './../identifier/locationBundleId.yaml#/components/schemas/locationBundleId'
            - $ref: './../identifier/maloId.yaml#/components/schemas/maloId'
            - $ref: './../identifier/meloId.yaml#/components/schemas/meloId'
            - $ref: './../identifier/neloId.yaml#/components/schemas/neloId'
          description: "Identifiziert das Lokationsbündel mittels einer eindeutigen ID im Clearing kann dies die Lokationsbündel-ID, die Malo-ID oder die Nelo-ID sein"
        expectedData:
          $ref: './locationBundleObjectStateViewSenderExpectedData.yaml#/components/schemas/locationBundleObjectStateViewSenderExpectedData'
          description: "Die Listen der zu erwarteten Daten aus Sicht des Senders"
        systemData:
          $ref: './locationBundleObjectStateViewSenderSystemData.yaml#/components/schemas/locationBundleObjectStateViewSenderSystemData'
          description: "Die Listen der Daten im System aus Sicht des Senders"
        noExpectedData:
          $ref: './locationBundleObjectStateViewSenderNoExpectedData.yaml#/components/schemas/locationBundleObjectStateViewSenderNoExpectedData'
          description: "Erwartetes Datum ab dem im Lokationsbündel keine Objekte enthalten sind aus Sicht des Senders"
        noSystemData:
          $ref: './locationBundleObjectStateViewSenderNoSystemData.yaml#/components/schemas/locationBundleObjectStateViewSenderNoSystemData'
          description: "Im System vorhandenes Datum ab dem im Lokationsbündel keine Objekte enthalten sind aus Sicht des Senders"