components:
  schemas:
    locationBundleNetworkOperatorChangeMaloReference:
      required:
      - regardMaloId
      - measuringPointOperator
      - transmissionSystemOperator
      type: object
      x-Translation:
        de: "Eine Marktlokation mit ihren zugehörigen Marktpartnern"
      properties:
        regardMaloId:
          $ref: './../identifier/maloId.yaml#/components/schemas/maloId'
          description: "Identifiziert die Marktlokation mittels einer eindeutigen ID"
        measuringPointOperator:
          $ref: './../identifier/marketPartnerId.yaml#/components/schemas/marketPartnerId'
          description: "Messstellenbetreiber, der der Marktlokation zugeordnet ist"
        supplier:
          $ref: './../identifier/marketPartnerId.yaml#/components/schemas/marketPartnerId'
          description: "Lieferant, der der Marktlokation zugeordnet ist"
        transmissionSystemOperator:
          $ref: './../identifier/marketPartnerId.yaml#/components/schemas/marketPartnerId'
          description: "UENB, der der Marktlokation zugeordnet ist"