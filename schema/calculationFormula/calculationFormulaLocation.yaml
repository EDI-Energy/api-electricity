components:
  schemas:
    calculationFormulaLocation:
      required:
      - location
      - calculatedOutcome
      - calculationFormulas
      type: object
      description: "Berechnungsformel für Berechnungsziele von Energiemengen einer Marktlokation oder einer Netzlokation für die genannten Verwendungszwecke auf Basis von Werten von Messlokationen."
      x-Translation:
        de: "Berechnungsformel für Berechnungsziele von Energiemengen einer Marktlokation oder einer Netzlokation für die genannten Verwendungszwecke auf Basis von Werten von Messlokationen."
      properties:
        location:
          oneOf:
            - $ref: './../identifier/maloId.yaml#/components/schemas/maloId'
              description: "Marktlokations-ID"
            - $ref: './../identifier/neloId.yaml#/components/schemas/neloId'
              description: "Netzlokations-ID"
        calculatedOutcome:
          $ref: './../calculatedOutcome.yaml#/components/schemas/calculatedOutcome'
          description: "Berechnungsformel-Ziel, Beschreibung des fachlichen Ziels der Berechnungsformel aus dem Edi@Energy Dokument 'Codeliste der Berechnungsformelziele'."
        calculationFormulas:
          $ref: './listCalculationFormulasLocation.yaml#/components/schemas/listCalculationFormulasLocation'
          description: "Berechnungsformel für jeweils einen Zeitraum"  