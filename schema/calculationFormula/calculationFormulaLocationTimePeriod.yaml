components:
  schemas:
    calculationFormulaLocationTimePeriod:
      required:
      - executionTimeFrom
      - purposeOfUses
      - calculationOperands
      - calculationFormula
      type: object
      description: "Berechnungsformel für einen Zeitraum"
      x-Translation:
        de: "Berechnungsformel für einen Zeitraum"
      properties:
        executionTimeFrom:
          $ref: './../dateAndTime/zeroTimeLegalGerman.yaml#/components/schemas/zeroTimeLegalGerman'
          description: "Zeitpunkt Gültig Ab"
        purposeOfUses:
          $ref: './../purposeOfUses.yaml#/components/schemas/purposeOfUses'
          description: "Angabe der Verwendungszecke der Berechnungsformel"
        calculationOperands:
          $ref: './calculationOperandsLocation.yaml#/components/schemas/calculationOperandsLocation'
          description: "Liste von Operanden, die in der ausgeschriebenen Berechnungsformel, die zur Ermittlung der Energiemenge der Marktlokation bzw. die Netzlokation für das genannte Berechnungsziel notwendig sind."
        allocationFactors:
          $ref: './allocationFactors.yaml#/components/schemas/allocationFactors'
          description: "Liste von Aufteilungsfaktoren, die in der ausgeschriebenen Berechnungsformel, die zur Ermittlung der Energiemenge der Marktlokation bzw. die Netzlokation für das genannte Berechnungsziel notwendig sind."
        parameterIDs:
          $ref: './parameterIdCalculationFormulas.yaml#/components/schemas/parameterIdCalculationFormulas'
          description: "Liste Parameter-IDs, die in der ausgeschriebenen Berechnungsformel, die zur Ermittlung der Energiemenge der Marktlokation bzw. die Netzlokation für das genannte Berechnungsziel notwendig sind."
        calculationFormula:
          $ref: './calculationFormula.yaml#/components/schemas/calculationFormula'
          description: "Die ausgeschriebene Berechnungsformel, die zur Ermittlung der Energiemenge der Marktlokation bzw. die Netzlokation für das genannte Berechnungsziel notwendig ist."