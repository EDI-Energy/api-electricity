components:
  schemas:
    commandControlControllableResource:
      required:
      - srId
      - executionTimeFrom
      type: object
      properties:
        srId:
          $ref: './../identifier/srId.yaml#/components/schemas/srId'
        executionTimeFrom:
          $ref: './../dateAndTime/dateTime.yaml#/components/schemas/dateTime'
        maximumPowerValueKW:
          $ref: './maximumPowerValue.yaml#/components/schemas/maximumPowerValue'
        maximumPowerValuePercent:
          $ref: './../percent.yaml#/components/schemas/percent'
      oneOf:
        - required:
          - maximumPowerValueKW
        - required:
          - maximumPowerValuePercent