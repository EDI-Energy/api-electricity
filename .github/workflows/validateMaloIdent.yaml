 name: OpenAPI validation für MaloIdent V2
 on:
  push:
  pull_request:
  workflow_dispatch:

 jobs:
   validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint (multi-file, resolves $ref)
        run: npx @redocly/cli@latest lint api/identificationId/maloIdentV2.yaml

      - name: Bundle (optional but robust)
        run: npx @redocly/cli@latest bundle api/identificationId/maloIdentV2.yaml -o dist/maloIdentV2.bundle.yaml

      - name: Lint bundled spec
        run: npx @redocly/cli@latest lint dist/maloIdentV2.bundle.yaml