name: Automatisches Labeln von Konsultationsbeiträgen

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start (z.B. 2026-02-02T00:00:00Z)"
        required: true
        default: "2026-02-02T00:00:00Z"
      end:
        description: "Ende (z.B. 2026-02-28T00:00:00Z)"
        required: true
        default: "2026-02-28T00:00:00Z"

permissions:
  issues: write

jobs:
  label_consultation_issues:
    runs-on: ubuntu-24.04
    env:
      ALLOWED_USERS: ${{ secrets.FREIGEGEBENE_NUTZERNAMEN }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}

    steps:
      - name: Issues im Zeitraum labeln
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const start = new Date(process.env.START);
            const end   = new Date(process.env.END);

            if (isNaN(start) || isNaN(end) || start >= end) {
              core.setFailed(`Ungültiger Zeitraum: START="${process.env.START}" END="${process.env.END}"`);
              return;
            }

            const allowed = (process.env.ALLOWED_USERS || '')
              .split(',')
              .map(u => u.trim())
              .filter(Boolean);

            core.info(`Zeitraum: [${start.toISOString()} .. ${end.toISOString()})`);
            core.info(`ALLOWED_USERS (${allowed.length}): ${allowed.join(', ') || '(leer)'}`);

            // Labels sicherstellen
            async function ensureLabel(name, color = 'ededed', description = '') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  core.info(`Label "${name}" existiert nicht -> wird angelegt`);
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw e;
                }
              }
            }

            await ensureLabel('Konsultationsbeitrag', '0e8a16', 'Beitrag innerhalb des Konsultationszeitraums von freigegebenem Nutzer');
            await ensureLabel('Status zu klären',        'fbca04', 'Beitrag im Zeitraum, aber Nutzer nicht freigegeben');

            // Issues laden 
            const all = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                per_page: 100,
                sort: 'created',
                direction: 'desc',
              }
            );

            core.info(`Geladen (Issues+PRs): ${all.length}`);

            let scanned = 0;
            let inWindow = 0;
            let labeled = 0;

            for (const it of all) {
              scanned++;

              // PRs überspringen
              if (it.pull_request) continue;

              const createdAt = new Date(it.created_at);

              // Sobald älter als start, wird abgebrochen
              if (createdAt < start) break;

              if (!(createdAt >= start && createdAt < end)) continue;

              inWindow++;

              const issue_number = it.number;
              const author = it.user?.login || '';
              const existing = (it.labels || []).map(l => l.name).filter(Boolean);

              if (existing.includes('Konsultationsbeitrag') || existing.includes('Status zu klären')) {
                core.info(`#${issue_number}: Ziel-Label bereits vorhanden -> skip`);
                continue;
              }

              const labelToAdd = allowed.includes(author) ? 'Konsultationsbeitrag' : 'Status zu klären';

              core.info(`#${issue_number}: created_at=${it.created_at} author=${author} -> "${labelToAdd}"`);

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [labelToAdd],
              });

              labeled++;
            }

            core.info(`Gescannt: ${scanned}`);
            core.info(`Im Zeitraum: ${inWindow}`);
            core.info(`Neu gelabelt: ${labeled}`);
