openapi: 3.0.0
info:
  title: >-
    EDI@Energy API-Webdienst zur Übermittlung von Berechnungsformeln für
    Berechnungsziele von Energiemengen für Marktlokationen, Netzlokationen und
    Tranchen, einschließlich ihrer Verwendungszwecke, sowie zur Übermittlung der
    zugehörigen Antworten und zur Beendigung der Berechnungsvorgänge.
  version: 1.0.0
  description: >-
    Mit diesem API-Webdienst wird die Übermittlung von Berechnungsformeln für
    Berechnungsziele von Energiemengen für Marktlokationen, Netzlokationen und
    Tranchen, einschließlich ihrer Verwendungszwecke, sowie zur Übermittlung der
    zugehörigen Antworten und zur Beendigung der Berechnungsvorgänge realisiert.
paths:
  /calculationFormula/location/v1:
    post:
      tags:
        - >-
          Berechnungsformel Lokation
      summary: >-
        Übermittlung der Berechnungsformel für ein Berechnungsziel einer Marktlokation/Netzlokation
      description: >-
        Übermittlung der Berechnungsformel für ein Berechnungsziel von
        Energiemengen einer Marktlokation oder einer Netzlokation, für die
        genannten Verwendungszwecke, auf Basis von Werten von Messlokationen.
      parameters:
        - name: transactionId
          in: header
          description: >-
            Externe Transaktions-Id zur eindeutigen Identifikation der
            Übermittlung einer Berechnungsformel des sendenden NB.
          required: true
          schema:
            $ref: ../../schema/header/transactionId.yaml#/components/schemas/transactionId
        - name: creationDateTime
          in: header
          description: Zeitpunkt an dem der Aufruf erstellt wurde
          required: true
          schema:
            $ref: ../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime
        - name: initialTransactionId
          in: header
          description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
          required: false
          schema:
            $ref: ../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId
        - name: testFlag
          in: header
          description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
          required: true
          schema:
            $ref: ../../schema/header/testFlag.yaml#/components/schemas/testFlag
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../schema/calculationFormula/calculationFormulaLocation.yaml#/components/schemas/calculationFormulaLocation
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '500':
          description: Internal Server Error1
  /calculationFormula/location/response/v1:
    post:
      tags:
        - >-
          Berechnungsformel Lokation
      summary: >-
        Übermittlung der Antwort auf eine Berechnungsformel für ein
        Berechnungsziel einer Marktlokation/Netzlokation
      description: >-
