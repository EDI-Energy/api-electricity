            Externe Vorgangsreferenz zur eindeutigen Identifikation der ursprünglichen Anfrage.
        required: true
        schema:
          $ref: ../../schema/header/referenceId.yaml#/components/schemas/referenceId
      - name: testFlag
        in: header
