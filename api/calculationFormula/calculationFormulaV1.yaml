          required: true
          schema:
            $ref: ../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime
        - name: initialTransactionId
          in: header
          description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
          required: false
          schema:
            $ref: ../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId
        - name: referenceId
          in: header
          description: >-
            Externe Vorgangsreferenz zur eindeutigen Identifikation der
            ursprünglichen Anfrage.
          required: true
          schema:
            $ref: ../../schema/header/referenceId.yaml#/components/schemas/referenceId
        - name: testFlag
          in: header
          description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
          required: true
          schema:
            $ref: ../../schema/header/testFlag.yaml#/components/schemas/testFlag
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../schema/calculationFormula/calculationFormulaResponse.yaml#/components/schemas/calculationFormulaResponse
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '500':
          description: Internal Server Error1
  /calculationFormula/location/termination/v1:
    post:
      tags:
        - >-
          Beendigung Berechnungsformel Lokation
      summary: >-
        Beendigung der Berechnungsformel für ein Berechnungsziel Marktlokation/Netzlokation
      description: >-
        Beendigung der Berechnungsformel für ein Berechnungsziel von
        Energiemengen einer Marktlokation oder einer Netzlokation auf Basis von
        Werten von Messlokationen.
      parameters:
        - name: transactionId
          in: header
          description: >-
            Externe Transaktions-Id zur eindeutigen Identifikation der
            Beendigung einer Berechnungsformel des sendenden NB.
          required: true
          schema:
            $ref: ../../schema/header/transactionId.yaml#/components/schemas/transactionId
        - name: creationDateTime
          in: header
