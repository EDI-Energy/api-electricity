openapi: 3.0.0 # OpenAPI-Version (erlaubte Features und Syntax)
info: # Allgemeine Infos zur Schnittstelle
  title: EDI@Energy API-Webdienste zur prozessualen Abwicklung von Steuerungshandlungen in Verbindung mit intelligenten Messsystemen (iMS) -  Universalbestellprozess
  version: 2.0.0
  description: Mit diesen API-Webdiensten werden die Steuerungshandlungen in Verbindung mit intelligenten Messsystemen umgesestzt.
  
servers: # URLs unter der die API bereitsteht
  - url: https://github.com/EDI-Energy
    description: GitHub-Server der EDI@Energy
  

paths:
  /steuerbefehl/konfiguration/v2:
    post:
      summary: Anweisung Steuerbefehl vom NB/LF an MSB zur Regelung auf einen Leistungswert.
      description: ""
      operationId: uploadFile
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation der Information über den bestätigten Steuerbefehl des sendenden Marktpartners.
        required: true
        style: simple
        explode: false
        schema:
                $ref: '../../schema/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        style: simple
        explode: false
        schema:
                $ref: '../../schema/creationDateTime.yaml#/components/schemas/creationDateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        style: simple
        explode: false
        schema:
                $ref: '../../schema/initialTransactionId.yaml#/components/schemas/initialTransactionId'

      - name: locationId
        in: query
        description: Identifiziert die Lokation (Netzlokation oder Steuerbare Ressource) auf die der Steuerbefehl wirken soll (SR-ID oder Nelo-ID).<b>ID der Netzlokation</b> (Schema neloId) oder <b>ID der Steuerbaren Ressource</b> (Schema srId).
        required: true
        style: form
        explode: false
        example: C1234848431
        schema:
          oneOf:
            - $ref: '../../schema/srId.yaml#/components/schemas/srId'
            - $ref: '../../schema/neloId.yaml#/components/schemas/neloId'
      - name: commandControl
        in: query
        description: Objekt des Steuerbefehls Beginn Steuerung
        required: true
        content:
         application/json: 
          schema: 
           required: 
           - maximumPowerValue
           - executionTimeFrom
           type: object
           properties:
             maximumPowerValue:
               $ref: '../../schema/maximumPowerValue.yaml#/components/schemas/maximumPowerValue'
             executionTimeFrom:
               $ref: '../../schema/executionTimeFrom.yaml#/components/schemas/executionTimeFrom'
             executionTimeUntil:
               $ref: '../../schema/executionTimeUntil.yaml#/components/schemas/executionTimeUntil'
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: binary

      responses:
        "202":
          description: accepted  
        "400":
          description: Bad Request

        "401":
          description: Unauthorized

        "404":
          description: Not Found

        "405":
          description: Method not allowed

        "500":
          description: Internal Server Error

