openapi: 3.0.0 # OpenAPI-Version (erlaubte Features und Syntax)
info: # Allgemeine Infos zur Schnittstelle
  title: EDI@Energy API-Webdienst zur Übermittlung der Übersicht und den ausgerollten Zählzeiten
  version: 1.0.0
  description: Mit diesem API-Webdienst wird die Übermittlung der Übersicht und den ausgerollten Zählzeiten umgesetzt.

paths:
  /definition/countingTime/overviewNetworkOperator/v1:
    post:
      tags:
        - Übersicht Zählzeit
      summary: Übermittlung der Übersicht der Zählzeiten eines NB
      description: ""
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation der Übermittlung der Übersicht der Zählzeiten des sendenden Marktpartners.
        required: true
        schema:
          $ref: '../../schema/header/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        schema:
          $ref: '../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        schema:
          $ref: '../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId'
      - name: testFlag
        in: header
        description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
        required: true
        schema:
          $ref: '../../schema/header/testFlag.yaml#/components/schemas/testFlag'
      requestBody:
        content:
         application/json:
           schema:
             $ref: '../../schema/definitions/overviewCountingTimeNetworkOperator.yaml#/components/schemas/overviewCountingTimeNetworkOperator'
      responses:
        "202":
          description: accepted
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "405":
          description: Method not allowed
        "422": 
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
 
