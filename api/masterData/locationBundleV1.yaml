openapi: 3.0.0 # OpenAPI-Version (erlaubte Features und Syntax)
info: # Allgemeine Infos zur Schnittstelle
  title: >-
    EDI@Energy API-Webdienst zur Übermittlung von Lokationsbündeln
  version: 1.0.0
  description: >-
    Mit diesen API-Webdiensten wird die Übermittlung von Lokationsbündeln, die 
    Beendigung von Lokationsbündeln, die Antwort auf die Übermittlung von Lokationsbündeln, 
    die Übermittlung von Lokationsbündeln mit Nennung der zugeordneten 
    Marktpartnern im Rahmen von Netzbetreiberwechselprozessen und die 
    Übermittlung von Clearings zu Lokationsbündeln umgesetzt. 

paths:
  /masterData/locationBundle/v1:
    post:
      tags: 
        - >- 
          Lokationsbündel
      summary: >-
        Übermittlung von Lokationsbündeln
      description: >-
        Übermittlung von Lokationsbündeln. Ein Lokationsbündel beinhaltet 
        alle Netzlokationen (in der Regel genau eine Netzlokation, außer bei komplexeren 
        Anschlusssituationen können es mehrere sein), mit den dahinter elektrotechnisch 
        verbundenen Marktlokationen (und den ggf. vorhandenen Tranchen), mit allen 
        technischen Ressourcen der Marktlokationen, den vorhandenen Messlokationen, 
        die für die Energiemengenermittlung notwendig sind um die erforderlichen 
        Verwendungszwecke zu bedienen, sowie alle an dem Lokationsbündel vorkommenden 
        steuerbare Ressourcen, wobei die steuerbare Ressource ohne Zuordnung zu einer 
        technischen Ressource übermittelt wird, da dies durch den MSB über eine 
        Stammdatennachricht erfolgt.
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs.
        required: true
        schema:
          $ref: '../../schema/header/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        schema:
          $ref: '../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        schema:
          $ref: '../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId'
      - name: testFlag
        in: header
        description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
        required: false
        schema:
          $ref: '../../schema/header/testFlag.yaml#/components/schemas/testFlag'
      requestBody:
        content:
         application/json:
           schema:
             $ref: '../../schema/masterData/locationBundle.yaml#/components/schemas/locationBundle'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
  
  /masterData/locationBundle/result/v1:
    post:
      tags:
        - >-
          Lokationsbündel
      summary: >-
        Antwort auf die Übermittlung von Lokationsbündeln 
      description: >-
        Antwort auf die Übermittlung von Lokationsbündeln, ein ermittelter Antwortcode 
        aus einem EBD übermittelt und somit eine Antwort auf die Übermittlung von 
        Lokationsbündeln gegeben werden. Unter locationBundleId gibt der Sender der 
        Antwort die ID an, auf welche sich die Antwort bezieht, die Antwort kann nur 
        positiv sein, da der ursprüngliche Sender der Verantwortliche ist. 
        Unter locationBundleObjects kann der Sender der Antwort seine Sichtweise angeben, 
        dies ändert jedoch nichts an den übermittelten Daten des Verantwortlichen. 
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation der Anfrage des sendenden Marktpartners.
        required: true
        schema:
          $ref: '../../schema/header/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        schema:
          $ref: '../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        schema:
          $ref: '../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId'
      - name: referenceId
        in: header
        description: Externe Vorgangsreferenz zur eindeutigen Identifikation der ursprünglichen Anfrage.
        required: true
        schema:
          $ref: '../../schema/header/referenceId.yaml#/components/schemas/referenceId'
      - name: testFlag
        in: header
        description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
        required: false
        schema:
          $ref: '../../schema/header/testFlag.yaml#/components/schemas/testFlag'
      requestBody:
        content:
         application/json:
           schema:
             $ref: '../../schema/resultToRequest/resultLocationBundle.yaml#/components/schemas/resultLocationBundle'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /masterData/locationBundleNetworkOperatorChange/v1:
    post:
      tags:
        - >-
          Lokationsbündel
      summary: >-
        Übermittlung von Lokationsbündeln mit Nennung der zugeordneten Marktpartnern im 
        Rahmen von Netzbetreiberwechselprozessen.
      description: >-
        Übermittlung von Lokationsbündeln mit Nennung der zugeordneten Marktpartnern im 
        Rahmen von Netzbetreiberwechselprozessen. Dabei werden die Marktpartner genannt, 
        die zum Zeitpunkt des Versendens der Nachricht dem NBA für den Zeitpunkt des 
        Netzbetreiberwechsels vorliegen. Eine Abbildung in Zeitscheiben findet 
        für die Marktpartnerzuordnung nicht statt.
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs.
        required: true
        schema:
          $ref: '../../schema/header/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        schema:
          $ref: '../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        schema:
          $ref: '../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId'
      - name: testFlag
        in: header
        description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
        required: false
        schema:
          $ref: '../../schema/header/testFlag.yaml#/components/schemas/testFlag'
      requestBody:
        content:
         application/json:
           schema:
             $ref: '../../schema/masterData/locationBundleNetworkOperatorChange.yaml#/components/schemas/locationBundleNetworkOperatorChange'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /masterData/locationBundleClearing/v1:
    post:
      tags:
        - >-
          Lokationsbündel
      summary: >-
        Übermittlung von Clearings zu Lokationsbündeln.
      description: >-
        Übermittlung von Clearings zu Lokationsbündeln. Dabei kann der Datenstand im 
        IT System des Berechtigten dargestellt werden und zudem wenn erforderlich die 
        Erwartung an die Daten, wie der Berechtigte sie gerne vom Verantwortlichen bekommen
        würde. Ein Lokationsbündel beinhaltet alle Netzlokationen (in der Regel genau eine
        Netzlokation, außer bei komplexeren Anschlusssituationen können es mehrere sein) 
        mit den dahinter elektrotechnisch verbundenen Marktlokationen (und den ggf. 
        vorhandenen Tranchen), mit allen technischen Ressourcen der Marktlokationen, 
        den vorhandenen Messlokationen, die für die Energiemengenermittlung notwendig
        sind um die erforderlichen Verwendungszwecke zu bedienen, sowie alle an dem 
        Lokationsbündel vorkommenden steuerbare Ressourcen, wobei die steuerbare 
        Ressource ohne Zuordnung zu einer technischen Ressource übermittelt wird, 
        da dies durch den MSB über eine Stammdatennachricht erfolgt.
      parameters:
      - name: transactionId
        in: header
        description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs.
        required: true
        schema:
          $ref: '../../schema/header/transactionId.yaml#/components/schemas/transactionId'
      - name: creationDateTime
        in: header
        description: Zeitpunkt an dem der Aufruf erstellt wurde
        required: true
        schema:
          $ref: '../../schema/dateAndTime/dateTime.yaml#/components/schemas/dateTime'
      - name: initialTransactionId
        in: header
        description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
        required: false
        schema:
          $ref: '../../schema/header/initialTransactionId.yaml#/components/schemas/initialTransactionId'
      - name: testFlag
        in: header
        description: Angabe, ob es sich bei dem Aufruf um einen Testaufruf handelt.
        required: false
        schema:
          $ref: '../../schema/header/testFlag.yaml#/components/schemas/testFlag'
      requestBody:
        content:
         application/json:
           schema:
             $ref: '../../schema/masterData/locationBundleObjectClearingSenderData.yaml#/components/schemas/locationBundleObjectClearingSenderData'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
